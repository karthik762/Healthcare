
spring.application.name=HealthSummarizer

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:health_summarizer}?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server configuration
server.port=${PORT:10000}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# AI configuration: Google Gemini (primary cloud provider) & Ollama (local/offline option)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# Ollama local/fallback configuration
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
app.ollama.api-key=${OLLAMA_API_KEY:}

# CORS configuration
app.cors.allowed-origins=${FRONTEND_URL:}

